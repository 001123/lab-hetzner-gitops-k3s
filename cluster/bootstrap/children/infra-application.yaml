---
# infra = cluster-wide shared services (VictoriaMetrics + Grafana today;
# logging, backup, ... later). ONE Application for the whole tier — same
# pattern as `platform`, one tier up:
#   platform (wave -1): what other apps DEPEND on (cert-manager, ClusterIssuer)
#   infra    (wave  0): what the cluster runs for itself (nothing blocks on it)
#   apps     (wave  1): user workloads (folder-synced ApplicationSet)
# Internal ordering lives in cluster/infra/kustomization.yaml (sync-waves).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/001123/lab-hetzner-gitops-k3s.git
    targetRevision: main
    path: cluster/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: victoria-metrics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
