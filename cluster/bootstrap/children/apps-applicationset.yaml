---
# FOLDER SYNC for USER apps: every directory under cluster/apps/ becomes one
# auto-synced Application. Adding a new app = commit a new directory, nothing
# else (plan/init/01-plan.md §3).
#
# Tiering (see cluster/bootstrap/children/):
#   platform -> apps = shared foundation (certs + monitoring) -> user workloads
# platform/ (cert-manager, monitoring, ...) is NOT managed here — it is the
# single `platform` Application in platform-application.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/001123/lab-hetzner-gitops-k3s.git
        revision: main
        directories:
          - path: cluster/apps/*
  template:
    metadata:
      name: "{{.path.basename}}"
      annotations:
        argocd.argoproj.io/description: "Generated from {{.path.path}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/001123/lab-hetzner-gitops-k3s.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
