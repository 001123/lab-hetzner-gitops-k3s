---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-nginx

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - configmap.yaml

# KSOPS generator: decrypts secret.sops.yaml at build time (ArgoCD) or locally
# (`kustomize build --enable-alpha-plugins --enable-exec`).
generators:
  - secret-generator.yaml
