---
# KSOPS generator: decrypts secret.sops.yaml at build time (ArgoCD) or locally
# (`kustomize build --enable-alpha-plugins --enable-exec`).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: grafana-admin-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secret.sops.yaml
