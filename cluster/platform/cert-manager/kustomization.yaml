---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  - namespace.yaml

# cert-manager via the upstream jetstack chart, pinned.
# Inflated by `kustomize build --enable-helm` (enabled globally in argocd-cm).
helmCharts:
  - name: cert-manager
    version: v1.21.2
    repo: https://charts.jetstack.io
    releaseName: cert-manager
    namespace: cert-manager
    valuesInline:
      crds:
        enabled: true
        keep: true
      prometheus:
        enabled: false

# Everything from this directory lands in sync-wave -1, so the cert-manager
# CRDs exist before cluster-issuer.yaml (wave 0) is applied by ArgoCD.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"
