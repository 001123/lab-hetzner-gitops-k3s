---
# infra = cluster-wide shared services (monitoring, logging, backup, ...).
#
# Deployed as ONE ArgoCD Application (`infra`, created in
# cluster/bootstrap/children/infra-application.yaml) — same pattern as
# `platform`, one tier up: platform = things other apps DEPEND on (cert-manager),
# infra = services the cluster runs for itself (but nothing blocks on them),
# apps = user workloads (folder-synced by the `apps` ApplicationSet).
#
# Order inside this app: victoria-metrics (implicit wave 0) then grafana
# (explicit wave 1, see grafana/kustomization.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - victoria-metrics/
  - grafana/
