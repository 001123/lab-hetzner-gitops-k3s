---
# k3s server install / upgrade (version pinned in group_vars/all.yml).
- name: Download the k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Check the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_version_current
  changed_when: false
  failed_when: false

- name: Install or upgrade k3s (server, pinned version)
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_version not in (k3s_version_current.stdout | default(''))

- name: Wait until the k3s node is Ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Read the k3s kubeconfig from the server
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw
  run_once: true

- name: Rewrite the API server address to the public IP
  ansible.builtin.set_fact:
    kubeconfig_content: >-
      {{ (k3s_kubeconfig_raw.content | b64decode)
         | replace('server: https://127.0.0.1:6443',
                   'server: https://' ~ ansible_host ~ ':6443') }}
  run_once: true

- name: Write the kubeconfig to the dev machine
  ansible.builtin.copy:
    content: "{{ kubeconfig_content }}"
    dest: "{{ kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true

- name: Show how to talk to the cluster
  ansible.builtin.debug:
    msg: >-
      kubeconfig written to {{ kubeconfig_local_path }} (existing ~/.kube/config untouched).
      Use `make nodes` or run scripts/get-kubeconfig.sh to install it into ~/.kube/config.
  run_once: true
