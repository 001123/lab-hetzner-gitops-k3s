---
# Multica CLI + agent daemon — "connect this machine" as a Multica runtime.
#
# Installs the pinned CLI release from GitHub Releases (same artifact naming as
# upstream install.sh: multica-cli-<ver>-linux-<arch>.tar.gz), points it at the
# self-hosted server, logs in with a personal access token (headless-safe), and
# runs the daemon under systemd so it survives reboots.
#
# Scope note: this role installs ONLY the Multica CLI + daemon. It detects and
# registers whatever agent CLIs (claude, codex, ...) are already on PATH — with
# none installed the daemon comes up healthy but registers 0 runtimes. Install
# at least one agent CLI (and sign it in) to let agents execute on this machine.

- name: Assert the target is a supported Linux host
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_architecture in ['x86_64', 'aarch64', 'arm64']
    fail_msg: >-
      This role installs the Linux amd64/arm64 release binary only
      (detected {{ ansible_system }}/{{ ansible_architecture }}). On macOS use
      `brew install multica-ai/tap/multica` instead.

- name: Assert the Multica API token is configured
  ansible.builtin.assert:
    that:
      - multica_api_token is defined
      - multica_api_token | length > 0
    fail_msg: >-
      multica_api_token is empty. Create a personal access token in the web UI
      (Settings -> API Tokens, https://{{ multica_app_hostname }}/settings?tab=tokens),
      put it into ansible/inventory/group_vars/all.sops.yml via
      `sops ansible/inventory/group_vars/all.sops.yml`, then re-run.

- name: Check the installed Multica CLI version
  ansible.builtin.command:
    cmd: "{{ multica_cli_bin_dir }}/multica version"
  register: multica_cli_version_current
  changed_when: false
  failed_when: false

- name: Download the pinned Multica CLI release tarball
  ansible.builtin.get_url:
    url: "https://github.com/multica-ai/multica/releases/download/v{{ multica_cli_version }}/{{ multica_cli_release_asset }}"
    dest: "/tmp/{{ multica_cli_release_asset }}"
    mode: "0644"
  when: multica_cli_version not in (multica_cli_version_current.stdout | default(''))

- name: Install the Multica CLI binary
  ansible.builtin.unarchive:
    src: "/tmp/{{ multica_cli_release_asset }}"
    dest: "{{ multica_cli_bin_dir }}"
    remote_src: true
    owner: "{{ multica_cli_daemon_user }}"
    group: "{{ multica_cli_daemon_group }}"
    mode: "0755"
  when: multica_cli_version not in (multica_cli_version_current.stdout | default(''))

- name: Read the current Multica CLI config
  ansible.builtin.command:
    cmd: "{{ multica_cli_bin_dir }}/multica config show"
  register: multica_cli_config_current
  changed_when: false
  failed_when: false

- name: Point the CLI at the self-hosted API server
  ansible.builtin.command:
    cmd: "{{ multica_cli_bin_dir }}/multica config set server_url https://{{ multica_api_hostname }}"
  when: multica_api_hostname not in (multica_cli_config_current.stdout | default(''))
  changed_when: true

- name: Point the CLI at the self-hosted web app
  ansible.builtin.command:
    cmd: "{{ multica_cli_bin_dir }}/multica config set app_url https://{{ multica_app_hostname }}"
  when: multica_app_hostname not in (multica_cli_config_current.stdout | default(''))
  changed_when: true

# `multica auth status` has no --output flag, exits 0 either way, and prints
# EVERYTHING to stderr: "Not authenticated" when logged out, or Server/User plus
# a masked token ("mul_xxxxxxxx...") with a valid login. Decide on the combined
# output: re-login when logged out OR when the masked prefix no longer matches
# multica_api_token (i.e. the token was rotated in all.sops.yml).
- name: Check the current Multica auth status
  ansible.builtin.command:
    cmd: "{{ multica_cli_bin_dir }}/multica auth status"
  register: multica_cli_auth_status
  changed_when: false
  failed_when: false

- name: Compose the auth status output for the login decision
  ansible.builtin.set_fact:
    multica_cli_auth_output: "{{ (multica_cli_auth_status.stdout | default('')) ~ (multica_cli_auth_status.stderr | default('')) }}"

- name: Log in with the personal access token
  ansible.builtin.command:
    cmd: "{{ multica_cli_bin_dir }}/multica login --token {{ multica_api_token }}"
  when: >-
    multica_cli_auth_status.rc != 0
    or 'Server:' not in multica_cli_auth_output
    or multica_api_token[:12] not in multica_cli_auth_output
  changed_when: true
  no_log: true

# Any daemon NOT supervised by the systemd unit must die before the unit starts,
# otherwise both race for the local daemon port (upstream default 127.0.0.1:19514)
# and the loser exits 1 on every Restart=always cycle — an endless restart loop
# (observed: 12.296 restarts / 5s apart) that burns CPU and floods the journal.
#
# Failure mode this replaces: the old cleanup ran `multica daemon stop` only when
# the unit was not running, but a daemon started by hand in an interactive SSH
# session (`multica daemon start --foreground`, reparented to PID 1, cgroup
# user.slice/session-*.scope) is not tracked by the unit's MainPID, so the unit
# could never take the port. Never assume "unit not running" == "nothing to stop".
#
# The bracket trick `[m]ultica daemon start` keeps pgrep from matching the shell
# that runs this probe (its own command line contains the literal pattern).
- name: Find multica daemon processes not supervised by the systemd unit
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      unit_pid="$(systemctl show -p MainPID --value {{ multica_cli_daemon_service }} 2>/dev/null || true)"
      for pid in $(pgrep -f '[m]ultica daemon start' || true); do
        if [ "$pid" != "${unit_pid:-0}" ]; then echo "$pid"; fi
      done
    executable: /bin/bash
  register: multica_cli_stray_daemon_pids
  changed_when: false
  failed_when: false
  check_mode: false

- name: Stop untracked daemons (graceful `daemon stop`, then SIGTERM)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pids="{{ multica_cli_stray_daemon_pids.stdout_lines | join(' ') }}"
      {{ multica_cli_bin_dir }}/multica daemon stop >/dev/null 2>&1 || true
      for _ in $(seq 1 15); do
        alive=""
        for pid in $pids; do kill -0 "$pid" 2>/dev/null && alive="$alive $pid"; done
        [ -z "$alive" ] && exit 0
        sleep 1
      done
      echo "graceful stop timed out, sending SIGTERM:$alive" >&2
      kill $alive 2>/dev/null || true
      for _ in $(seq 1 10); do
        alive=""
        for pid in $pids; do kill -0 "$pid" 2>/dev/null && alive="$alive $pid"; done
        [ -z "$alive" ] && exit 0
        sleep 1
      done
      echo "untracked multica daemon(s) still alive:$alive" >&2
      exit 1
    executable: /bin/bash
  when: >-
    (multica_cli_stray_daemon_pids.stdout_lines | default([])) | length > 0
    and not ansible_check_mode
  changed_when: true

- name: Wait for the daemon port to be released
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ multica_cli_daemon_port }}"
    state: stopped
    timeout: 30
  when: >-
    (multica_cli_stray_daemon_pids.stdout_lines | default([])) | length > 0
    and not ansible_check_mode

- name: Install the multica-daemon systemd unit
  ansible.builtin.template:
    src: multica-daemon.service.j2
    dest: "/etc/systemd/system/{{ multica_cli_daemon_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart multica-daemon

- name: Enable and start the multica-daemon service
  ansible.builtin.systemd:
    name: "{{ multica_cli_daemon_service }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Gather service facts after daemon start
  ansible.builtin.service_facts:

- name: Assert the daemon service is running
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts.services | default({}))
        .get(multica_cli_daemon_service ~ '.service', {}).get('state', '') == 'running'
    fail_msg: >-
      Service {{ multica_cli_daemon_service }} is not running. Inspect it with
      `journalctl -u {{ multica_cli_daemon_service }} -n 100` on the target host.

- name: Read the daemon status
  ansible.builtin.command:
    cmd: "{{ multica_cli_bin_dir }}/multica daemon status"
  register: multica_cli_daemon_status
  changed_when: false
  failed_when: false

- name: Show runtime status and next steps
  ansible.builtin.debug:
    msg: >-
      Multica CLI {{ multica_cli_version }} installed at {{ multica_cli_bin_dir }}/multica,
      daemon `{{ multica_cli_daemon_service }}` is running and enabled at boot.
      Status: {{ (multica_cli_daemon_status.stdout_lines | default([])) | join(' | ') }}
      Next: install at least one agent CLI (claude, codex, ...) and sign it in on
      this machine — the daemon registers one runtime per detected CLI, so until
      then the machine shows up in Settings -> Runtimes with 0 agents.
