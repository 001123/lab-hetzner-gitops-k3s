---
# ArgoCD via the official Helm chart, pinned, with KSOPS wired into the
# repo-server (see plan/init/01-plan.md §4 and the KSOPS README).
#
# NOTE: helm/kubectl run on the DEV MACHINE (delegate_to: localhost) — that is
# where the pinned toolchain lives (plan §0.1); the VPS has no helm.
- name: Check the kubeconfig exists on the dev machine
  ansible.builtin.stat:
    path: "{{ kubeconfig_local_path }}"
  delegate_to: localhost
  become: false
  register: argocd_kubeconfig
  run_once: true

- name: Assert the kubeconfig is available (run `make bootstrap-k3s` first)
  ansible.builtin.assert:
    that: argocd_kubeconfig.stat.exists
    fail_msg: >-
      {{ kubeconfig_local_path }} not found — run the k3s playbook first
      (make bootstrap-k3s) so the kubeconfig is written to the dev machine.
  run_once: true

- name: Add the Argo Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_local_path }}"

- name: Install / upgrade ArgoCD
  kubernetes.core.helm:
    name: argo-cd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd
    create_namespace: true
    values: "{{ lookup('template', 'argocd-values.yaml.j2') | from_yaml }}"
    # The repo may be registered (helm_repository above reports ok) while its
    # cached index is missing (e.g. after a cache cleanup) — `helm show chart`
    # then fails with "no cached repo found". Always refresh the index first.
    update_repo_cache: true
    wait: true
    timeout: 600s
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_local_path }}"

- name: Check that argocd-repo-server is Available
  ansible.builtin.command: kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=300s
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_local_path }}"
  changed_when: false

- name: Show how to reach ArgoCD
  ansible.builtin.debug:
    msg: >-
      ArgoCD UI: https://{{ argocd_hostname }} (Let's Encrypt {{ letsencrypt_issuer_name }}),
      login admin / value of argocd_admin_password in
      ansible/inventory/group_vars/all.sops.yml
