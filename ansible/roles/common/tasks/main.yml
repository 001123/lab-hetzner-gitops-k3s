---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read active swap devices (/proc/swaps)
  ansible.builtin.command: cat /proc/swaps
  register: common_proc_swaps
  changed_when: false
  when: not common_swap_enabled | bool

- name: Disable swap now (k3s expects swap off)
  ansible.builtin.command: swapoff -a
  when:
    - not common_swap_enabled | bool
    # first line of /proc/swaps is the header
    - common_proc_swaps.stdout_lines | length > 1

- name: Disable swap at boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^([^#\s].*\s+swap\s+.*)$'
    line: '# \1'
    backrefs: true
  when: not common_swap_enabled | bool

- name: Enable IPv4 forwarding (containers / k3s)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

# NOTE: Docker CE is also running on this host and manipulates iptables directly,
# so ufw rules do not apply to ports published by Docker. All workloads run in
# k3s anyway (see plan/init/01-plan.md §0).
- name: Allow SSH from the admin CIDR
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ ufw_allow_ssh_from }}"
    comment: SSH

- name: Allow HTTP / HTTPS (Traefik + ACME HTTP-01)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: web
  loop:
    - "80"
    - "443"

- name: Allow k3s API from the admin CIDR
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: "{{ ufw_allow_ssh_from }}"
    comment: k3s-api-kubectl
  when: ufw_allow_k3s_api | bool

- name: Enable ufw (deny incoming by default)
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny
