<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#326ce5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f6821f;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="40" fill="#0d1117" />
  <circle cx="100" cy="100" r="70" stroke="url(#grad1)" stroke-width="6" fill="none" stroke-dasharray="12 6" opacity="0.8" />
  <polygon points="100,45 145,72 145,128 100,155 55,128 55,72" fill="url(#grad1)" opacity="0.85" filter="url(#glow)" />
  <circle cx="100" cy="100" r="24" fill="#ffffff" />
  <circle cx="100" cy="100" r="14" fill="#0d1117" />
</svg>
