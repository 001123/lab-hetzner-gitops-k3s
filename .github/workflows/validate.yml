---
name: validate

on:
  pull_request:
  push:
    branches: [main]

env:
  KUSTOMIZE_VERSION: v5.8.1
  KSOPS_VERSION: 4.5.1
  SOPS_VERSION: v3.13.3
  AGE_VERSION: v1.3.2

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Empty when the repo secret is not configured (that is fine, see below).
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize, ksops, sops, age
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kustomize
          curl -fsSL "https://github.com/viaduct-ai/kustomize-sops/releases/download/v${KSOPS_VERSION}/ksops_${KSOPS_VERSION}_Linux_x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin ksops
          curl -fsSL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" | sudo tee /usr/local/bin/sops > /dev/null
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          sudo chmod +x /usr/local/bin/kustomize /usr/local/bin/ksops /usr/local/bin/sops /usr/local/bin/age /usr/local/bin/age-keygen

      # The repo is public: never let a plaintext Secret in.
      - name: Refuse plaintext Secrets
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            if grep -qE '^[[:space:]]*kind:[[:space:]]*Secret[[:space:]]*$' "$f" \
               && ! grep -qE '^[[:space:]]*sops:' "$f"; then
              echo "::error file=$f::plaintext kind: Secret — encrypt it (make sops-encrypt)"
              bad=1
            fi
          done < <(git ls-files '*.yaml' '*.yml')
          exit "$bad"

      # Every secret file must actually be encrypted (no key needed for this check).
      - name: SOPS lint (all *.sops.yaml must be encrypted)
        run: |
          set -euo pipefail
          bad=0
          for f in $(git ls-files | grep -E '\.sops\.ya?ml$' | grep -vE '(^|/)\.sops\.ya?ml$'); do
            if ! sops filestatus "$f" | grep -qE '"encrypted":[[:space:]]*"?true"?'; then
              echo "::error file=$f::not SOPS-encrypted — run make sops-encrypt"
              bad=1
            fi
          done
          exit "$bad"

      # Bootstrap manifests carry no secrets, so they build with no age key.
      # cluster/platform is deliberately NOT built here: cluster/platform/grafana
      # ships a KSOPS generator (admin credentials), so building it needs both
      # --enable-alpha-plugins --enable-exec AND the age key. It is built in the
      # keyed step below instead — this step previously failed for every commit
      # since the infra/platform merge with "external plugins disabled".
      - name: kustomize build (bootstrap)
        run: |
          set -euo pipefail
          kustomize build cluster/bootstrap/root-app > /dev/null
          kustomize build cluster/bootstrap/children > /dev/null

      # Make the coverage gap loud instead of silently green: without the key,
      # platform + apps (i.e. every KSOPS-encrypted workload) are never built.
      - name: Warn that platform + apps were not built
        if: ${{ env.SOPS_AGE_KEY == '' }}
        run: |
          echo "::warning title=SOPS_AGE_KEY is not set::cluster/platform and cluster/apps were NOT built. Add the age private key as the SOPS_AGE_KEY repository secret to validate charts + KSOPS decryption in CI."

      # App builds decrypt secrets via KSOPS, which needs the age private key.
      # Set the SOPS_AGE_KEY repo secret to enable the full app build in CI.
      # --enable-helm: platform + some apps (grafana, victoria-metrics) inflate
      # pinned charts via kustomize helmCharts (helm is preinstalled on
      # ubuntu-latest).
      - name: kustomize build (platform + apps, needs SOPS_AGE_KEY)
        if: ${{ env.SOPS_AGE_KEY != '' }}
        run: |
          set -euo pipefail
          kustomize build --enable-helm --enable-alpha-plugins --enable-exec cluster/platform > /dev/null
          for d in cluster/apps/*/; do
            kustomize build --enable-helm --enable-alpha-plugins --enable-exec "$d" > /dev/null
          done

      - name: ansible-lint
        run: |
          set -euo pipefail
          pipx install ansible-lint
          pipx inject ansible-lint ansible==14.4.0
          cd ansible && ansible-lint
